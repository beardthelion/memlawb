name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      - run: bun install --frozen-lockfile
      - name: Lint & format (Biome)
        run: bunx biome ci
      - name: Type-check
        run: bun run type-check
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  # The working tree always runs from source under Bun, so every packaging
  # failure is invisible to the job above: it was green while Node could not
  # import this package at all. This job is the only thing that reads the
  # artifact a consumer actually installs.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared engines floor, and is otherwise never exercised;
        # 22 is what a consumer most likely has today.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install --frozen-lockfile
      - name: Packed tarball, installed and driven under Node
        run: bun run test:package

  # The node storage driver's runtime dependencies are external binaries this
  # repo does not build, so nothing in the suite above can tell whether they are
  # present or at the version the Dockerfile pins. This job reads the image that
  # would actually ship.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      - name: Build the image
        run: docker build -t memlawb:test .
      - name: Both node binaries present and at the pinned version
        run: bun run test:image
